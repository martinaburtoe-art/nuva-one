<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NUVA — Reference Exact Master</title><style>html,body{margin:0;width:100%;height:100%;background:#08080b;overflow:hidden}body{display:grid;place-items:center}video{width:100vw;height:100vh;object-fit:contain;display:block;background:#08080b}#hint{position:fixed;left:12px;bottom:12px;z-index:2;font:10px/1.2 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:7px 9px;border:1px solid rgba(255,255,255,.18);transition:opacity .3s}body:hover #hint{opacity:.25}</style></head><body><video id="v" autoplay muted playsinline preload="auto"><source src="data:video/mp4;base64,PLACEHOLDER" type="video/mp4"></video><div id="hint">Exact visual master · reference video · tap to pause/play</div><script>const v=document.getElementById('v');document.body.addEventListener('click',e=>{if(e.target!==v)return;v.paused?v.play():v.pause()});v.addEventListener('ended',()=>{v.currentTime=0;v.play()});</script></body></html>
