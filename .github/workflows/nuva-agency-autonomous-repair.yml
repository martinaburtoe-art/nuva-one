name: Nüva Agency — Autonomous Repair Worker

on:
  schedule:
    - cron: '27,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  statuses: read
  checks: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Find failed Agency PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName --jq '[.[] | select(.headRefName | startswith("agent/agency-"))][0].number // empty')
          if [ -z "$number" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(gh pr view "$number" --json headRefOid --jq '.headRefOid')
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" --jq '[.statuses[] | select(.context=="nuva-agency/safety")][0].state // ""')
          if [ "$state" != "failure" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Inspect autonomous diff policy
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="${{ steps.pr.outputs.number }}"
          files="$(gh pr diff "$number" --name-only)"
          blocked='^(\.github/workflows/|supabase/migrations/|supabase/functions/|src/routes/auth|src/routes/api/(billing|checkout)|src/lib/(auth|security)|src/integrations/supabase/types\.ts$)'
          if echo "$files" | grep -Eq "$blocked"; then
            echo "Sensitive autonomous PR; repair requires controlled review."
            exit 1
          fi

      - name: Checkout Agency PR
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="${{ steps.pr.outputs.number }}"
          branch=$(gh pr view "$number" --json headRefName --jq '.headRefName')
          git fetch origin "$branch"
          git checkout --detach "$branch"
          echo "branch=$branch" >> "$GITHUB_ENV"

      - name: Collect current checks
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr checks "${{ steps.pr.outputs.number }}" || true

      - name: Run focused autonomous repair
        if: steps.pr.outputs.eligible == 'true'
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          prompt: |
            You are the Nüva Agency autonomous repair worker.

            The current Agency PR failed independent safety verification.
            Read GEMINI.md, docs/nuva-agency/CONSTRUCTION_AGENT.md and docs/AGENT_BACKLOG.md.
            Inspect the current branch and the available PR check output.

            Diagnose and repair ONLY the verified failure. Do not broaden scope.
            Never weaken tests or security. Never touch secrets.
            Do not modify auth/RLS, billing, checkout, Supabase migrations/functions,
            or GitHub workflows. If the failure is in a blocked area, make no change.

            Run relevant local validation. Leave only the focused repair in the workspace.
            Do not merge and do not create a new PR.

      - name: Verify repair locally
        if: steps.pr.outcome == 'success' && steps.pr.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair produced."
            exit 0
          fi
          npm install --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Push repair to Agency branch
        if: steps.pr.outcome == 'success' && steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "Nüva Agency"
          git config user.email "agency@nuva.one"
          git add -A
          git commit -m "fix(agency): repair failed autonomous verification"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$branch"
