name: Nüva Agency — Autonomous Merge Controller

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_run:
    workflows: ["Nüva Agency — Independent Safety Verification"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find verified Agency PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName --jq '[.[] | select(.headRefName | startswith("agent/agency-"))][0].number // empty')
          if [ -z "$number" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(gh pr view "$number" --json headRefOid --jq '.headRefOid')
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" --jq '[.statuses[] | select(.context=="nuva-agency/safety")][0].state // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" != "success" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Final autonomous policy check
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="${{ steps.pr.outputs.number }}"
          files="$(gh pr diff "$number" --name-only)"
          blocked='^(\.github/workflows/|supabase/migrations/|supabase/functions/|src/routes/auth|src/routes/api/(billing|checkout)|src/lib/(auth|security)|src/integrations/supabase/types\.ts$)'
          if echo "$files" | grep -Eq "$blocked"; then
            echo "Sensitive path detected; refusing autonomous merge."
            exit 1
          fi
          additions=$(gh pr view "$number" --json additions --jq '.additions')
          deletions=$(gh pr view "$number" --json deletions --jq '.deletions')
          total=$((additions + deletions))
          if [ "$total" -gt 220 ]; then
            echo "Diff exceeds autonomous limit."
            exit 1
          fi

      - name: Merge verified Agency PR
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" --squash --delete-branch
