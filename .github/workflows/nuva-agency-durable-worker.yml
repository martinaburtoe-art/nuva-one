name: Nüva Agency — Durable Specialist Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      agent:
        description: "Especialista específico (vacío = ejecutar los 13)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  execute:
    name: Claim and execute durable task (${{ matrix.agent }})
    if: ${{ !github.event.inputs.agent || github.event.inputs.agent == matrix.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # One in-flight worker per specialist; different specialists run in parallel.
      group: nuva-agency-durable-worker-${{ matrix.agent }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        agent:
          - orchestrator
          - constructor
          - finance
          - sales
          - supply
          - people
          - compliance
          - growth
          - security
          - qa
          - sentinel
          - ux
          - release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Execute durable specialist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          NUVA_AGENCY_AGENT_ID: ${{ matrix.agent }}
          NUVA_AGENCY_API_BASE_URL: ${{ secrets.NUVA_AGENCY_API_BASE_URL || 'https://nuva-one.vercel.app' }}
        run: node scripts/agency-durable-worker.mjs
