name: Sync home cinematic assets

on:
  push:
    paths:
      - ".github/workflows/sync-home-cinematic-assets.yml"
      - "public/home-cinematic/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Scanner master
        run: |
          mkdir -p public/home-cinematic
          curl -fL --retry 3 --retry-delay 2 \
            -o public/home-cinematic/scan.mp4 \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_2xnZNWgckgMqJUOALrLVbW5sagq/4cbc7fb1-6956-4790-8dee-9c1fce975d99.mp4"
          test -s public/home-cinematic/scan.mp4
          file public/home-cinematic/scan.mp4

      - name: Commit asset if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/home-cinematic/scan.mp4
          if git diff --cached --quiet; then
            echo "Scanner asset already synchronized"
          else
            git commit -m "chore(home): add real scanner cinematic asset"
            git push
          fi
