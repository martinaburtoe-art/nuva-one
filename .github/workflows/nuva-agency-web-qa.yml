name: Nuva Agency - Web QA

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to inspect (preview or production)"
        required: false
        default: "https://nuva-one.vercel.app"
  schedule:
    - cron: "7 * * * *"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - ".github/workflows/nuva-agency-web-qa.yml"

permissions:
  contents: read
  issues: write
  deployments: read

jobs:
  web-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve exact Vercel preview for this PR
        id: preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              per_page: 30,
            });
            for (const deployment of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                per_page: 10,
              });
              const ready = statuses.find((status) =>
                status.state === 'success' && (status.environment_url || status.target_url)
              );
              if (ready) {
                const url = ready.environment_url || ready.target_url;
                core.setOutput('url', url);
                core.info('Using successful preview for ' + sha + ': ' + url);
                return;
              }
            }
            core.setFailed('No successful Vercel preview deployment was found for PR head ' + sha + '; refusing to test production as a substitute.');
      - name: Run autonomous web QA
        id: qa
        # Fail closed: warnings (including Vercel protection or an unavailable preview) are not a passing QA result.
        env:
          # PR checks inspect the exact preview deployment attached to this commit.
          NUVA_QA_URL: ${{ steps.preview.outputs.url || github.event.inputs.target_url || 'https://nuva-one.vercel.app' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run agency:qa

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuva-agency-web-qa-${{ github.run_id }}
          path: artifacts/nuva-agency/web-qa.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish QA summary
        if: always()
        run: |
          if test -f artifacts/nuva-agency/web-qa.json; then
            node -e '
              const fs = require("fs");
              const s = JSON.parse(fs.readFileSync("artifacts/nuva-agency/web-qa.json", "utf8"));
              console.log("## Nüva Agency Web QA");
              console.log("");
              console.log(`Target: ${s.target}`);
              console.log(`Status: **${s.status.toUpperCase()}**`);
              console.log(`Checks: ${s.totals.checks} | Healthy: ${s.totals.healthy} | Warning: ${s.totals.warning} | Critical: ${s.totals.critical}`);
              for (const c of s.checks) console.log(`- ${c.status.toUpperCase()} — ${c.name}: ${c.detail}`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open QA incident
        if: steps.qa.outcome == 'failure' && hashFiles('artifacts/nuva-agency/web-qa.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const report = JSON.parse(fs.readFileSync("artifacts/nuva-agency/web-qa.json", "utf8"));
          if (report.status !== "critical") process.exit(0);
          const failed = report.checks.filter((c) => c.status === "critical");
          const title = `[Nüva Agency][QA] Critical web regression — ${report.target}`;
          const body = [
            "## Autonomous Web QA Incident",
            "",
            `Target: ${report.target}`,
            `Observed: ${report.generatedAt}`,
            "",
            ...failed.map((c) => `- **${c.name}** — ${c.detail}`),
            "",
            "No production mutation was performed. Investigation and remediation remain policy-gated."
          ].join("\n");
          const existing = execFileSync("gh", ["issue", "list", "--state", "open", "--search", `in:title "${title}"`, "--json", "number"], { encoding: "utf8" });
          if (JSON.parse(existing).length === 0) {
            execFileSync("gh", ["issue", "create", "--title", title, "--body", body], { stdio: "inherit" });
          }
          NODE
