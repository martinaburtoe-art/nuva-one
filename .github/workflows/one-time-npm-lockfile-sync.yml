name: One-time npm lockfile sync

on:
  push:
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove helper
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-npm-lockfile-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/one-time-npm-lockfile-sync.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(ci): synchronize npm lockfile after dependency fix"
          git push
