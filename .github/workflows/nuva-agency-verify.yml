name: Nuva Agency - Control Plane Verify

on:
  pull_request:
    paths:
      - "src/lib/agency/**"
      - "docs/NUVA_AGENCY_ARCHITECTURE.md"
      - "docs/nuva-agency/**"
      - ".github/workflows/nuva-agency-verify.yml"
      - "scripts/nuva-agency-certify.mjs"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "src/lib/agency/**"
      - "docs/NUVA_AGENCY_ARCHITECTURE.md"
      - "docs/nuva-agency/**"
      - ".github/workflows/nuva-agency-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate route tree
        run: npx @tanstack/router-cli generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Agency certification
        run: npm run agency:certify
