name: One-time npm dependency sync

on:
  push:
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-npm-dependency-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/one-time-npm-dependency-sync.yml
          git commit -m "chore(ci): synchronize npm lockfile" || exit 0
          git push
