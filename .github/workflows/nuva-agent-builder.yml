name: Nüva One — Autonomous Agency Workers

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read
  id-token: write

concurrency:
  group: nuva-agency-${{ github.repository }}
  cancel-in-progress: false

jobs:
  worker:
    name: Agency worker rotation
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit Nüva AI Gateway
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run agency:gateway

      - name: Select specialist for this cycle
        id: role
        shell: bash
        run: |
          set -euo pipefail
          roles=(constructor orchestrator finance sales supply people compliance growth security qa sentinel ux release)
          slot=$(( $(date -u +%s) / 1800 ))
          index=$(( slot % ${#roles[@]} ))
          role="${roles[$index]}"
          echo "role=$role" >> "$GITHUB_OUTPUT"
          echo "Selected Nüva Agency worker: $role"

      - name: Audit external control-plane connectivity
        id: connectivity
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'vnzyecnbdqbfuxawzrda' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_TTggp4XCuSLXEuFjyNsR6dHwf8Xe' }}
        run: |
          set -euo pipefail
          echo "github=connected" | tee -a "$GITHUB_STEP_SUMMARY"

          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            curl -fsS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF"               -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" >/dev/null
            echo "supabase_management=connected" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "supabase_management=not_configured" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${VERCEL_TOKEN:-}" ]; then
            curl -fsS "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID"               -H "Authorization: Bearer $VERCEL_TOKEN" >/dev/null
            echo "vercel_api=connected" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "vercel_api=not_configured" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check autonomous safety gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("agent/agency-"))] | length')
          echo "open_agency_prs=$open"
          if [ "$open" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ci_fast=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-fast.yml --branch main --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          echo "latest_main_ci_fast=$ci_fast"
          if [ "$ci_fast" = "failure" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Record work-cycle start
        if: steps.gate.outputs.skip != 'true'
        id: cycle_start
        shell: bash
        run: |
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run specialist worker
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        id: worker
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          prompt: |
            You are the ${{ steps.role.outputs.role }} worker inside Nüva Agency.
            You are one of 13 persistent digital workers improving the real Nüva One repository.

            FIRST read GEMINI.md, docs/nuva-agency/CONSTRUCTION_AGENT.md and docs/AGENT_BACKLOG.md.
            Then read docs/nuva-agency/LEARNING_PROTOCOL.md and inspect any recent
            agency learning evidence available in the repository.
            Inspect recent commits, open issues/PRs and current CI evidence before changing anything.

            PERSISTENT MARKET-READINESS MISSION:
            Do NOT treat this as a generic rotating maintenance cycle. The persistent mission is to make Nüva One
            genuinely ready for market launch, using current evidence and the repository's release criteria.
            Continue from the current state; never reset the mission when the specialist role changes.
            Prioritize, in order: production/release blockers; security/tenant/data integrity; broken core business
            flows; incomplete or unusable modules; regression/reliability; accessibility/responsive UX; onboarding,
            activation, SEO and visual polish; documentation. The goal is not to create PRs or activity.
            The goal is a verifiable release candidate.

            MARKET-READINESS ACCEPTANCE GATE:
            Before declaring the mission complete, current evidence must support C1 Code Integrity, C2 Integration,
            C3 Business Integrity, C4 Experience, and C5 Production. Exercise the real critical chain where safely
            possible: tenant -> customers -> products -> purchase -> receipt -> inventory -> sale -> payment ->
            cash/finance -> accounting -> Nüva Intelligence -> Action Queue -> outcomes -> reports.
            Inspect every critical user-facing module for broken routes, dead actions, missing loading/empty/error
            states, responsive failures and high-impact accessibility defects. Do not duplicate Nüva Intelligence.
            Validate deterministic financial/legal calculations with existing tests; AI may explain/recommend but must
            not replace deterministic business rules. For every FAIL/WARN/UNKNOWN, either repair it and revalidate,
            or record exact external dependency, evidence, owner/action and why it cannot be resolved safely.

            EXTERNAL BLOCKER RECOVERY:
            The currently known blockers are Cloudflare Workers AI (cloudflare_account_ai_not_found) and Vercel
            deployment/build-rate limits. Diagnose them with approved APIs/configuration first. If credentials or
            provider configuration are missing, identify the exact missing configuration without exposing secrets.
            If Vercel cannot deploy because of a platform quota, continue all non-deployment release work and leave
            production certification explicitly pending rather than claiming success.

            Your role for this cycle is exactly: ${{ steps.role.outputs.role }}.
            Work on ONE evidence-backed objective, but do NOT stop merely because one patch, file or subtask is finished.
            Continue inspecting, implementing and validating the objective until its acceptance criteria are actually
            satisfied and independently evidenced. If the first fix exposes another necessary subtask inside the same
            objective, complete it before stopping. A cycle may stop only when: (A) the objective is fully validated,
            (B) an explicit hard safety boundary is reached, or (C) an external dependency makes further progress
            impossible and the blocker is recorded with exact evidence. Never stop because the task is inconvenient,
            the first test passed, or a single change was made.
            Treat previous validated incidents, regressions and successful fixes as training evidence:
            infer recurring failure patterns, prefer proven remediation strategies, and record a concise
            new lesson in the PR summary when the cycle discovers a reusable pattern. Do not claim model
            training occurred unless a measurable training/evaluation step actually ran.

            ROLE FOCUS:
            constructor = implementation, bug fixes and focused refactors.
            orchestrator = prioritize and coordinate the highest-value verified task; implement it if safe.
            finance = finance, cash, accounting and financial integrity flows.
            sales = sales, CRM, quotes and conversion flows.
            supply = purchases, inventory, stock and fulfillment flows.
            people = Nüva People, payroll, contracts, attendance and HR flows.
            compliance = Chilean compliance, risk controls and evidence.
            growth = onboarding, activation, product growth and SEO.
            security = auth, authorization, tenant isolation and AppSec; report/PR only for sensitive changes.
            qa = regression tests, deterministic verification and flaky-test repair.
            sentinel = observability, production errors, telemetry and reliability.
            ux = accessibility, responsive behavior, interaction quality and visual polish.
            release = release gates, CI/CD and certification evidence.

            AUTONOMOUS SAFETY:
            - Never commit secrets or credentials.
            - Never mutate production data directly.
            - Never weaken auth, RLS, billing, checkout or security controls to make tests pass.
            - Never reintroduce Nüva Studio, WhatsApp or n8n runtime architecture.
            - Never duplicate Nüva Intelligence on the homepage.
            - Do not modify Supabase migrations, RLS/auth, billing, checkout, or GitHub workflows in an autonomous application PR.
            - External-system changes must use approved APIs/CLI and least-privilege credentials; never
              paste tokens into files, prompts, logs or PR bodies.
            - Keep the implementation focused and under 220 changed lines.
            - Do not modify package-lock.json or generated route trees unless explicitly required.
            - Prefer changes independently validated by lint, typecheck, unit tests and build.
            - If no safe evidence-backed task exists, make no code change and report the finding.

            IMPLEMENTATION LOOP:
            inspect -> define acceptance criteria -> implement -> validate -> inspect result -> repair remaining defects
            -> revalidate -> repeat until the objective is complete or a hard safety/external blocker is proven.
            Do not browse the whole repository or redesign architecture. Stay focused on the objective.

            COMPLETION GATE:
            Before stopping, explicitly prove each acceptance criterion. If any criterion is UNKNOWN, FAIL or merely
            assumed, keep working. If a blocker is external, document the exact dependency and continue with any safe
            subwork that does not depend on it. Do not declare completion from model confidence.

            Final response must contain exactly:
            TASK, WHY, FILES, VALIDATION, RESULT, REMAINING_RISK.
          settings: |
            {
              "model": {
                "name": "gemini-3.1-flash-lite",
                "maxSessionTurns": -1,
                "disableLoopDetection": true
              },
              "telemetry": { "enabled": false }
            }

      - name: Groq coding-agent fallback
        if: ${{ steps.gate.outputs.skip != 'true' && steps.worker.outcome != 'success' }}
        id: groq_fallback
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ACTIVE_AGENT: ${{ steps.role.outputs.role }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::Gemini worker failed and GROQ_API_KEY is not configured."
            exit 1
          fi

          npm install --global --no-audit --no-fund opencode-ai
          opencode --version
          mkdir -p .agency
          cat > .agency/groq-fallback-prompt.md <<'PROMPT'
          You are the Groq-backed coding-agent fallback for Nüva One.
          FIRST read GEMINI.md, AGENTS.md, docs/nuva-agency/CONSTRUCTION_AGENT.md,
          docs/AGENT_BACKLOG.md and docs/nuva-agency/LEARNING_PROTOCOL.md.
          Inspect recent commits, open issues/PRs and current CI evidence before changing anything.
          Your specialist role is: ${{ steps.role.outputs.role }}.
          Continue the persistent market-readiness mission; do not start a generic or unrelated task.
          Prioritize release blockers, security/tenant/data integrity, broken core business flows,
          incomplete modules, reliability, accessibility/responsive UX, onboarding, activation and SEO.
          Use C1 Code Integrity, C2 Integration, C3 Business Integrity, C4 Experience and C5 Production.
          Preserve RLS, tenant isolation, authentication, billing, checkout and deterministic financial/legal rules.
          Never expose secrets, mutate production data, weaken security, or bypass CI.
          Do not add Nüva Studio, WhatsApp or n8n, and do not duplicate Nüva Intelligence.
          Do not modify Supabase migrations, RLS/auth, billing, checkout, or GitHub workflows in this application PR.
          Keep the change focused under 220 changed lines; do not modify package-lock.json or generated route trees.
          Work in this workspace only: do not commit or open a PR; the workflow will run focused verification
          and create the PR only if the changes pass. If no safe change exists, make no code changes and report evidence.
          Use these exact headings, one per line: TASK:, WHY:, FILES:, VALIDATION:, RESULT:, REMAINING_RISK:.
          PROMPT

          export OPENCODE_PERMISSION='{"*":"allow"}'
          opencode run --model "groq/${GROQ_MODEL}" --agent build --title "Nüva Agency ${ACTIVE_AGENT} fallback" "$(cat .agency/groq-fallback-prompt.md)" 2>&1 | tee .agency/groq-fallback-output.log
          test -s .agency/groq-fallback-output.log
          for marker in TASK WHY FILES VALIDATION RESULT REMAINING_RISK; do
            if ! grep -Eiq "^${marker}([[:space:]]*:|[[:space:]]+)" .agency/groq-fallback-output.log; then
              echo "::error::Groq fallback report missing section: ${marker}"
              exit 1
            fi
          done
          git diff --check
          delimiter="GROQ_FALLBACK_$(date +%s%N)"
          {
            echo "summary<<$delimiter"
            tail -c 2500 .agency/groq-fallback-output.log
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Focused verification
        if: steps.gate.outputs.skip != 'true' && !cancelled() && (steps.worker.outcome == 'success' || steps.groq_fallback.outcome == 'success')
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No implementation produced."
            exit 0
          fi

          changed_lines="$(git diff --numstat | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          if [ "$changed_lines" -gt 220 ]; then
            echo "Autonomous change rejected: $changed_lines changed lines exceeds the 220-line safety budget."
            exit 1
          fi

          if git diff --name-only | grep -Eq '(^|/)package-lock\.json$'; then
            echo "Autonomous change rejected: package-lock.json is not allowed."
            exit 1
          fi

          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Remove generated verification churn
        if: steps.gate.outputs.skip != 'true' && !cancelled() && (success() || failure())
        run: |
          git checkout -- package-lock.json src/routeTree.gen.ts 2>/dev/null || true

      - name: Create autonomous PR
        if: steps.gate.outputs.skip != 'true' && !cancelled() && steps.focused_verification.outcome == 'success' && (steps.worker.outcome == 'success' || steps.groq_fallback.outcome == 'success')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          branch: agent/agency-${{ steps.role.outputs.role }}
          delete-branch: true
          title: 'feat(agency): ${{ steps.role.outputs.role }} autonomous improvement'
          commit-message: 'feat(agency): ${{ steps.role.outputs.role }} autonomous improvement'
          labels: 'agency-autonomous'
          body: |
            ## Nüva Agency autonomous worker

            **Worker:** ${{ steps.role.outputs.role }}
            **Cycle:** ${{ github.run_id }}

            This PR was created by the rotating Nüva Agency workforce.
            It is eligible for autonomous merge only after independent safety verification,
            validation and repository protection rules pass.

            ### Agent result
            ${{ steps.worker.outputs.summary || steps.groq_fallback.outputs.summary || 'Inspect workflow logs for the worker result.' }}

            ### Policy
            No secrets, production mutations, retired product scope or security bypasses are allowed.

      - name: Publish cycle summary
        if: always()
        run: |
          echo "## Nüva Agency cycle" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: ${{ steps.role.outputs.role || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Safety gate skipped: ${{ steps.gate.outputs.skip || 'not evaluated' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker outcome: ${{ steps.worker.conclusion || 'not run' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Learning mode: evidence-driven; no unverified self-training claims." >> "$GITHUB_STEP_SUMMARY"
          echo "External control plane: GitHub always; Supabase/Vercel conditional on scoped credentials." >> "$GITHUB_STEP_SUMMARY"
