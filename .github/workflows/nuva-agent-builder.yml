            {"model":{"name":"gemini-3.1-flash-lite","maxSessionTurns":-1,"disableLoopDetection":true},"telemetry":{"enabled":false}}

      - name: Heartbeat durable lease — pass 7
        if: steps.gate.outputs.skip != 'true' && !cancelled() && env.AGENCY_LEASE_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AGENCY_BASE_URL: https://nuva-one.vercel.app
        run: |
          set -euo pipefail
          curl -fsS -X POST "$AGENCY_BASE_URL/api/owner/agency-control"             -H "Authorization: Bearer $GH_TOKEN"             -H "Content-Type: application/json"             -H "X-Agency-Run-Id: $GITHUB_RUN_ID"             -H "X-Agency-Agent-Id: ${{ steps.role.outputs.role }}"             --data "{\"action\":\"heartbeat\",\"leaseToken\":\"$AGENCY_LEASE_TOKEN\",\"extendSeconds\":3600}" | jq .
      - name: Continue same objective — pass 8
        if: steps.gate.outputs.skip != 'true' && !cancelled() && steps.worker_continue_7.outcome != 'cancelled'
        continue-on-error: true
        id: worker_continue_8
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          prompt: |
            CONTINUATION 8/8 OF THE SAME OBJECTIVE. Do not start a new objective.
            Inspect the current workspace, accumulated diff, tests and acceptance evidence.
            Continue active engineering work: identify remaining gaps, edge cases, regressions,
            integration failures or missing evidence; implement safe fixes and validate them.
            If implementation is complete, perform deeper targeted regression and boundary verification.
            Do not fabricate work, do not merely wait, and do not stop for convenience.
            Continue until the objective is genuinely evidenced as complete or a hard safety/external blocker is proven.
            End with TASK, WHY, FILES, VALIDATION, RESULT, REMAINING_RISK.
          settings: |
            {"model":{"name":"gemini-3.1-flash-lite","maxSessionTurns":-1,"disableLoopDetection":true},"telemetry":{"enabled":false}}

      - name: Finish durable mission task
        if: steps.gate.outputs.skip != 'true' && !cancelled() && env.AGENCY_LEASE_TOKEN != '' && (success() || failure())
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AGENCY_BASE_URL: https://nuva-one.vercel.app
        run: |
          set -euo pipefail
          status="completed"
          if [ "${{ steps.worker.outcome }}" != "success" ]; then status="failed"; fi
          summary="$(tail -n 80 .agency/task.json 2>/dev/null | tr '
' ' ' | cut -c1-4000)"
          payload="$(jq -n --arg action finish_task --arg token "$AGENCY_LEASE_TOKEN" --arg status "$status" --arg summary "$summary" --arg run "$GITHUB_RUN_ID" --arg outcome "${{ steps.worker.outcome }}" '{action:$action,leaseToken:$token,status:$status,summary:$summary,result:{run_id:$run,worker_outcome:$outcome}}')"
          curl -fsS -X POST "$AGENCY_BASE_URL/api/owner/agency-control"             -H "Authorization: Bearer $GH_TOKEN"             -H "Content-Type: application/json"             -H "X-Agency-Run-Id: $GITHUB_RUN_ID"             -H "X-Agency-Agent-Id: ${{ steps.role.outputs.role }}"             --data "$payload" | jq .
      - name: Verify continuous objective evidence
        if: steps.gate.outputs.skip != 'true' && !cancelled() && (success() || failure())
        shell: bash
        run: |
          set -euo pipefail
          echo "Same objective remains active until acceptance criteria are PASS or a proven hard safety/external blocker exists."
          echo "Worker outcome: ${{ steps.worker.outcome || 'unknown' }}"
          echo "Continuation passes: 8"

      - name: Verify required continuation passes
        if: steps.gate.outputs.skip != 'true' && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          echo "Required continuation passes completed/attempted: 8"
          echo "Continuous objective evidence is based on eight same-objective passes plus focused validation, not artificial wall-clock waiting."
          echo "Continuation passes: 8" >> "$GITHUB_STEP_SUMMARY"
      - name: Focused verification
        if: steps.gate.outputs.skip != 'true' && !cancelled() && (success() || failure())
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No implementation produced."
            exit 0
          fi

          changed_lines="$(git diff --numstat | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          if [ "$changed_lines" -gt 220 ]; then
            echo "Autonomous change rejected: $changed_lines changed lines exceeds the 220-line safety budget."
            exit 1
          fi

          if git diff --name-only | grep -Eq '(^|/)package-lock\.json$'; then
            echo "Autonomous change rejected: package-lock.json is not allowed."
            exit 1
          fi

          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Remove generated verification churn
        if: steps.gate.outputs.skip != 'true' && !cancelled() && (success() || failure())
        run: |
          git checkout -- package-lock.json src/routeTree.gen.ts 2>/dev/null || true

      - name: Create autonomous PR
        if: steps.gate.outputs.skip != 'true' && !cancelled() && steps.focused_verification.outcome == 'success' && steps.worker.outcome == 'success'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          branch: agent/agency-${{ steps.role.outputs.role }}
          delete-branch: true
          title: 'feat(agency): ${{ steps.role.outputs.role }} autonomous improvement'
          commit-message: 'feat(agency): ${{ steps.role.outputs.role }} autonomous improvement'
          labels: 'agency-autonomous'
          body: |
            ## Nüva Agency autonomous worker

            **Worker:** ${{ steps.role.outputs.role }}
            **Cycle:** ${{ github.run_id }}

            This PR was created by the rotating Nüva Agency workforce.
            It is eligible for autonomous merge only after independent safety verification,
            validation and repository protection rules pass.

            ### Agent result
            ${{ steps.worker.outputs.summary || 'Inspect workflow logs for the worker result.' }}

            ### Policy
            No secrets, production mutations, retired product scope or security bypasses are allowed.

      - name: Publish cycle summary
        if: always()
        run: |
          echo "## Nüva Agency cycle" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: ${{ steps.role.outputs.role || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Safety gate skipped: ${{ steps.gate.outputs.skip || 'not evaluated' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker outcome: ${{ steps.worker.outcome || 'not run' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Learning mode: evidence-driven; no unverified self-training claims." >> "$GITHUB_STEP_SUMMARY"
          echo "External control plane: GitHub always; Supabase/Vercel conditional on scoped credentials." >> "$GITHUB_STEP_SUMMARY"
