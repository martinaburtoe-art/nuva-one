name: Nüva One — Autonomous Builder

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

concurrency:
  group: nuva-agent-builder
  cancel-in-progress: false

jobs:
  build:
    name: Internal construction cycle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for existing autonomous PR
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName --jq '[.[] | select(.headRefName == "agent/autonomous-cycle" or .headRefName == "agent/ci-repair")] | length')
          echo "open_agent_prs=$count"
          skip=false
          if [ "$count" -gt 0 ]; then skip=true; fi
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          echo "main_ci=$ci"
          if [ "$ci" = "failure" ]; then skip=true; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Run internal construction agent
        if: steps.gate.outputs.skip != 'true'
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          prompt: |
            You are the Nüva One Internal Construction Agent operating inside Nüva Agency.

            Read GEMINI.md, docs/nuva-agency/CONSTRUCTION_AGENT.md and docs/AGENT_BACKLOG.md first.
            Then inspect the current repository, recent commits, open issues/PRs and CI evidence.

            Your job is to BUILD, not merely report findings.
            Select exactly ONE highest-priority evidence-backed task.

            RELEASE PRIORITY:
            Open P0 release gates take precedence. In particular, inspect issue #145
            "P0 RELEASE: Golden Business Simulation y certificación de flujo end-to-end"
            and issue #144 "Market Release Gate". If #145 is still open and can be advanced
            safely, prefer it over speculative work.

            For #145, prefer composing existing tested business operations into a deterministic
            certification fixture/test rather than rewriting production architecture. Verify:
            tenant isolation, customers/products, purchase/receipt, inventory, sale/payment,
            cash/finance, accounting, Intelligence, Action Queue/outcome and reporting.

            Implement the selected task in the real repository.
            Preserve working functionality. Do not reintroduce Nüva Studio, WhatsApp or n8n.
            Do not touch secrets. Do not generate expensive media. Do not make broad refactors.
            Do not mutate production data directly.

            Validate the change with the most relevant tests. For code changes, run the
            available lint, typecheck, unit/integration tests and build as applicable.
            Database changes require migration/recovery verification and relevant pgTAP coverage.
            Diagnose failures instead of masking them.

            Stop after one coherent task. Create no unrelated work.
            Leave the workspace changes available for the PR creation step.

            Final response must contain:
            TASK, WHY, FILES, VALIDATION, RESULT, REMAINING_RISK.
          settings: |
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": false
              }
            }

      - name: Run focused verification
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No code changes produced; nothing to verify."
            exit 0
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Create autonomous pull request
        if: steps.gate.outputs.skip != 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          branch: agent/autonomous-cycle
          delete-branch: true
          title: 'feat(agent): autonomous Nüva One improvement'
          commit-message: 'feat(agent): autonomous Nüva One improvement'
          body: |
            ## Nüva One internal construction cycle

            This PR was produced by the scheduled Nüva Agency Internal Construction Agent.

            ### Agent summary
            ${{ steps.gemini.outputs.summary || 'No summary returned; inspect workflow logs.' }}

            ### Validation
            The workflow ran focused lint, typecheck, unit tests and production build after the agent edits.

            ### Merge policy
            CI, independent review and the Market Release Gate remain authoritative.
            The autonomous agent does not bypass failing checks or security controls.

      - name: Report result
        if: always()
        run: |
          echo "### Internal construction cycle" >> "$GITHUB_STEP_SUMMARY"
          echo "Builder gate: ${{ steps.gate.outputs.skip || 'not evaluated' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "PR: ${{ steps.cpr.outputs.pull-request-url || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
