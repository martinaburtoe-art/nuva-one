name: Free Beta Validation Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/load-test.mjs"
      - "scripts/prepare-load-test-fixture.mjs"
      - ".github/workflows/staging-load-test.yml"
      - "supabase/migrations/**"
      - "supabase/config.toml"

permissions:
  contents: read

concurrency:
  group: free-beta-validation-lab
  cancel-in-progress: true

jobs:
  validation:
    name: Free ephemeral 25 / 50 / 100 VU validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: "2.115.0"

      - name: Start lean ephemeral local Supabase
        run: |
          # The load test only needs Postgres, Auth, Kong and PostgREST.
          # Excluding Studio, Storage, Realtime, Edge Runtime, Mailpit,
          # analytics/logging and the local pooler removes unnecessary image
          # pulls and containers while preserving the API/auth test surface.
          supabase start -x studio,realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
          supabase status

      - name: Verify clean migration rebuild
        run: |
          supabase db reset --local
          supabase test db

      - name: Export local Supabase credentials
        shell: bash
        run: |
          mkdir -p artifacts
          eval "$(supabase status -o env)"
          test -n "$API_URL"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          {
            echo "API_URL=$API_URL"
            echo "ANON_KEY=$ANON_KEY"
            echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          echo "Local Supabase URL: $API_URL"

      - name: Create deterministic synthetic auth and business fixture
        run: node scripts/prepare-load-test-fixture.mjs

      - name: Run 25 / 50 / 100 VU acceptance battery
        env:
          LOAD_TEST_CONFIRM: "true"
          LOAD_TEST_ENV: staging
          LOAD_TEST_PHASES: "25,50,100"
          LOAD_TEST_ITERATIONS: "2"
          LOAD_TEST_OUTPUT: artifacts/staging-load-test-results.json
          VITE_SUPABASE_URL: ${{ env.API_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          LOAD_TEST_EMAIL: "loadtest@nuva.local"
          LOAD_TEST_PASSWORD: "NüvaLoadTest-2026!"
        run: node scripts/load-test.mjs

      - name: Run database recovery drill
        run: |
          supabase db reset --local
          supabase test db

      - name: Publish validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-beta-validation-evidence
          path: artifacts/
          if-no-files-found: warn

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup
