name: Staging Load Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-load-test
  cancel-in-progress: false

jobs:
  load-test:
    name: 25 / 50 / 100 VU staging acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate staging target
        env:
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: |
          test -n "$STAGING_URL"
          case "$STAGING_URL" in
            *nuva-one.vercel.app*|*nuvaone.cl*) echo "Production URL is not allowed"; exit 1 ;;
          esac

      - name: Run 25 / 50 / 100 VU acceptance battery
        env:
          LOAD_TEST_CONFIRM: "true"
          LOAD_TEST_ENV: staging
          LOAD_TEST_PHASES: "25,50,100"
          LOAD_TEST_ITERATIONS: "3"
          LOAD_TEST_OUTPUT: artifacts/staging-load-test-results.json
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          LOAD_TEST_EMAIL: ${{ secrets.LOAD_TEST_EMAIL }}
          LOAD_TEST_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
        run: node scripts/load-test.mjs

      - name: Publish load-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-load-test-results
          path: artifacts/staging-load-test-results.json
          if-no-files-found: warn
