name: Nüva One — Durable Autonomous Agent Worker

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read
  id-token: write

concurrency:
  group: nuva-durable-agent-${{ github.repository }}
  cancel-in-progress: false

jobs:
  durable-agent:
    name: Durable autonomous agent
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_HrwPy_KEw7KzxjCf9wphQQ_64VyMrCj
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select specialist
        id: role
        shell: bash
        run: |
          set -euo pipefail
          roles=(constructor orchestrator finance sales supply people compliance growth security qa sentinel ux release)
          slot=$(( $(date -u +%s) / 1200 ))
          index=$(( slot % ${#roles[@]} ))
          echo "role=${roles[$index]}" >> "$GITHUB_OUTPUT"
          echo "Selected durable agent: ${roles[$index]}"

      - name: Claim persisted mission task
        id: claim
        env:
          AGENCY_URL: https://vnzyecnbdqbfuxawzrda.supabase.co/functions/v1/nuva-agency-worker-control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agency
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nuva-one-agency" | jq -r .value)"
          echo "::add-mask::$oidc"
          export AGENCY_OIDC_TOKEN="$oidc"
          echo "AGENCY_OIDC_TOKEN=$oidc" >> "$GITHUB_ENV"

          roles=(constructor orchestrator finance sales supply people compliance growth security qa sentinel ux release)
          slot=$(( $(date -u +%s) / 1200 ))
          start_index=$(( slot % ${#roles[@]} ))
          claimed=false

          # One role can have no eligible task. Try the remaining specialists before skipping the cycle.
          for offset in "${!roles[@]}"; do
            index=$(( (start_index + offset) % ${#roles[@]} ))
            role="${roles[$index]}"
            http_code="$(curl -sS -o .agency/claim-response.json -w "%{http_code}" -X POST "$AGENCY_URL" \
              -H "X-Agency-OIDC-Token: $AGENCY_OIDC_TOKEN" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Content-Type: application/json" \
              -H "X-Agency-Run-Id: $GITHUB_RUN_ID" \
              -H "X-Agency-Agent-Id: $role" \
              --data '{"action":"claim_task","leaseSeconds":21600}')"
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "Claim API failed with HTTP $http_code for role $role"
              cat .agency/claim-response.json
              exit 1
            fi

            lease="$(jq -r '.claimed.lease.token // empty' .agency/claim-response.json)"
            if [ -z "$lease" ]; then
              echo "No eligible task for role $role; trying next specialist."
              continue
            fi

            jq '{claimed: (.claimed.task // null)}' .agency/claim-response.json > .agency/task.json
            echo "has_lease=true" >> "$GITHUB_OUTPUT"
            echo "active_role=$role" >> "$GITHUB_OUTPUT"
            echo "::add-mask::$lease"
            echo "AGENCY_LEASE_TOKEN=$lease" >> "$GITHUB_ENV"
            echo "Durable task claimed for $role."
            claimed=true
            break
          done

          if [ "$claimed" != true ]; then
            printf '{"claimed":null}\n' > .agency/task.json
            echo "has_lease=false" >> "$GITHUB_OUTPUT"
            echo "active_role=none" >> "$GITHUB_OUTPUT"
            echo "No eligible task exists for any of the 13 specialists; no work was claimed."
          fi
      - name: Run autonomous worker
        if: ${{ steps.claim.outputs.has_lease == 'true' }}
        id: worker
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          prompt: |
            You are a durable autonomous Nüva One engineering agent.
            Read GEMINI.md, docs/nuva-agency/CONSTRUCTION_AGENT.md, docs/AGENT_BACKLOG.md and docs/nuva-agency/LEARNING_PROTOCOL.md.
            Then read .agency/task.json. That persisted task is authoritative for this run.
            Your role is exactly: ${{ steps.claim.outputs.active_role }}.

            Mission: make Nüva One genuinely ready for market. Work on the persisted objective until it is actually
            validated. Inspect first, define acceptance criteria, implement only safe evidence-backed changes, validate,
            inspect the result, repair remaining defects and revalidate. Use the real repository and real tools.
            Delegate necessary specialist work through the durable control plane; do not leave informal handoffs.
            Preserve evidence in commits/tests/artifacts and do not claim completion from confidence.

            C1 Code Integrity, C2 Integration, C3 Business Integrity, C4 Experience and C5 Production are the acceptance
            model. Preserve tenant isolation, RLS, auth, billing, checkout, deterministic financial/legal calculations
            and existing security controls. Never expose secrets, mutate production data directly, or weaken controls.
            Do not add Nüva Studio, WhatsApp or n8n runtime architecture. Do not duplicate Nüva Intelligence.
            If an external blocker prevents part of the objective, prove it with evidence and continue all safe work
            that remains possible.

            The worker is durable: do not treat process termination as task completion. The task state is persisted in
            Supabase and may be resumed by another worker if this run expires or fails.

            End with exactly: TASK, WHY, FILES, VALIDATION, RESULT, REMAINING_RISK.
          settings: |
            {"model":{"name":"gemini-3.1-flash-lite","maxSessionTurns":-1,"disableLoopDetection":true},"telemetry":{"enabled":false}}

      - name: Heartbeat durable lease
        if: ${{ steps.claim.outputs.has_lease == 'true' }}
        continue-on-error: true
        env:
          AGENCY_URL: https://vnzyecnbdqbfuxawzrda.supabase.co/functions/v1/nuva-agency-worker-control
        run: |
          curl -fsS -X POST "$AGENCY_URL"             -H "X-Agency-OIDC-Token: $AGENCY_OIDC_TOKEN" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"             -H "Content-Type: application/json"             -H "X-Agency-Run-Id: $GITHUB_RUN_ID"             -H "X-Agency-Agent-Id: ${{ steps.claim.outputs.active_role }}"             --data "$(jq -n --arg token "$AGENCY_LEASE_TOKEN" '{action:"heartbeat",leaseToken:$token,extendSeconds:21600}')" | jq .

      - name: Continue durable objective — pass 1
        if: ${{ steps.claim.outputs.has_lease == 'true' && steps.worker.outcome == 'success' }}
        continue-on-error: true
        id: continue_1
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          prompt: |
            CONTINUATION 1/4 OF THE SAME PERSISTED TASK.
            Inspect .agency/task.json, the current diff, tests and evidence. Continue the same objective.
            Find remaining defects, edge cases, regressions or missing proof. Implement safe fixes and validate them.
            Do not start a new objective and do not stop merely because the first patch worked.
            End with TASK, WHY, FILES, VALIDATION, RESULT, REMAINING_RISK.
          settings: |
            {"model":{"name":"gemini-3.1-flash-lite","maxSessionTurns":-1,"disableLoopDetection":true},"telemetry":{"enabled":false}}

      - name: Heartbeat after pass 1
        if: ${{ steps.claim.outputs.has_lease == 'true' }}
        continue-on-error: true
        env:
          AGENCY_URL: https://vnzyecnbdqbfuxawzrda.supabase.co/functions/v1/nuva-agency-worker-control
        run: |
          curl -fsS -X POST "$AGENCY_URL"             -H "X-Agency-OIDC-Token: $AGENCY_OIDC_TOKEN" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json"             -H "X-Agency-Run-Id: $GITHUB_RUN_ID" -H "X-Agency-Agent-Id: ${{ steps.claim.outputs.active_role }}"             --data "$(jq -n --arg token "$AGENCY_LEASE_TOKEN" '{action:"heartbeat",leaseToken:$token,extendSeconds:21600}')" | jq .

      - name: Continue durable objective — pass 2
        if: ${{ steps.claim.outputs.has_lease == 'true' && steps.continue_1.outcome == 'success' }}
        continue-on-error: true
        id: continue_2
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          prompt: |
            CONTINUATION 2/4 OF THE SAME PERSISTED TASK.
            Re-inspect the current state and accumulated evidence. Continue implementation or targeted regression.
            Repair anything still incomplete. Do not fabricate progress.
            End with TASK, WHY, FILES, VALIDATION, RESULT, REMAINING_RISK.
          settings: |
            {"model":{"name":"gemini-3.1-flash-lite","maxSessionTurns":-1,"disableLoopDetection":true},"telemetry":{"enabled":false}}

      - name: Heartbeat after pass 2
        if: ${{ steps.claim.outputs.has_lease == 'true' }}
        continue-on-error: true
        env:
          AGENCY_URL: https://vnzyecnbdqbfuxawzrda.supabase.co/functions/v1/nuva-agency-worker-control
        run: |
          curl -fsS -X POST "$AGENCY_URL" -H "X-Agency-OIDC-Token: $AGENCY_OIDC_TOKEN" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json"             -H "X-Agency-Run-Id: $GITHUB_RUN_ID" -H "X-Agency-Agent-Id: ${{ steps.claim.outputs.active_role }}"             --data "$(jq -n --arg token "$AGENCY_LEASE_TOKEN" '{action:"heartbeat",leaseToken:$token,extendSeconds:21600}')" | jq .

      - name: Continue durable objective — pass 3
        if: ${{ steps.claim.outputs.has_lease == 'true' && steps.continue_2.outcome == 'success' }}
        continue-on-error: true
        id: continue_3
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          prompt: |
            CONTINUATION 3/4 OF THE SAME PERSISTED TASK.
            Perform deeper boundary verification, integration checks and regression analysis for the same objective.
            Implement safe repairs and validate. Stop only when complete or externally blocked with evidence.
            End with TASK, WHY, FILES, VALIDATION, RESULT, REMAINING_RISK.
          settings: |
            {"model":{"name":"gemini-3.1-flash-lite","maxSessionTurns":-1,"disableLoopDetection":true},"telemetry":{"enabled":false}}

      - name: Heartbeat after pass 3
        if: ${{ steps.claim.outputs.has_lease == 'true' }}
        continue-on-error: true
        env:
          AGENCY_URL: https://vnzyecnbdqbfuxawzrda.supabase.co/functions/v1/nuva-agency-worker-control
        run: |
          curl -fsS -X POST "$AGENCY_URL" -H "X-Agency-OIDC-Token: $AGENCY_OIDC_TOKEN" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json"             -H "X-Agency-Run-Id: $GITHUB_RUN_ID" -H "X-Agency-Agent-Id: ${{ steps.claim.outputs.active_role }}"             --data "$(jq -n --arg token "$AGENCY_LEASE_TOKEN" '{action:"heartbeat",leaseToken:$token,extendSeconds:21600}')" | jq .

      - name: Continue durable objective — pass 4
        if: ${{ steps.claim.outputs.has_lease == 'true' && steps.continue_3.outcome == 'success' }}
        continue-on-error: true
        id: continue_4
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          prompt: |
            CONTINUATION 4/4 OF THE SAME PERSISTED TASK.
            Perform the final independent verification pass. Inspect the objective, diff, tests, runtime evidence and
            remaining risk. Repair safe remaining defects. Do not declare success without evidence.
            End with TASK, WHY, FILES, VALIDATION, RESULT, REMAINING_RISK.
          settings: |
            {"model":{"name":"gemini-3.1-flash-lite","maxSessionTurns":-1,"disableLoopDetection":true},"telemetry":{"enabled":false}}

      - name: Groq coding-agent fallback
        if: ${{ always() && steps.claim.outputs.has_lease == 'true' && (steps.worker.outcome != 'success' || steps.continue_1.outcome != 'success' || steps.continue_2.outcome != 'success' || steps.continue_3.outcome != 'success' || steps.continue_4.outcome != 'success') }}
        id: groq_fallback
        env:
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ACTIVE_AGENT: ${{ steps.claim.outputs.active_role }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC is unavailable; secure Groq proxy cannot be used."
            exit 1
          fi

          npm install --global --no-audit --no-fund opencode-ai
          opencode --version
          node --check scripts/nuva-groq-openai-proxy.mjs
          node scripts/nuva-groq-openai-proxy.mjs > /tmp/nuva-groq-openai-proxy.log 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4318/health | jq -e '.ok == true' >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::Local OIDC-refreshing Groq proxy did not become healthy."
            exit 1
          fi
          export OPENCODE_CONFIG_CONTENT="$(jq -n --arg base_url 'http://127.0.0.1:4318/v1' '{provider:{"nuva-groq-proxy":{npm:"@ai-sdk/openai-compatible",name:"Nüva Groq OIDC Proxy",options:{baseURL:$base_url,apiKey:"nuva-local-oidc-proxy"},models:{"gpt-oss-20b":{name:"Groq GPT OSS 20B"}}}},permission:{"*":"allow"}}')"
          export OPENCODE_PERMISSION='{"*":"allow"}'

          cat > .agency/groq-fallback-prompt.md <<'PROMPT'
          You are the Groq-backed fallback coding agent for Nüva One.
          Read .agency/task.json, AGENTS.md, GEMINI.md, docs/nuva-agency/CONSTRUCTION_AGENT.md,
          docs/AGENT_BACKLOG.md and docs/nuva-agency/LEARNING_PROTOCOL.md.
          Your assigned specialist role is: ${{ steps.claim.outputs.active_role }}.
          Continue the same durable task. Gemini CLI failed due to provider quota or execution errors;
          inspect the working tree and preserve any partial changes already made.
          Work in the real repository. Define acceptance criteria, make safe evidence-backed changes,
          run relevant tests, and inspect the final diff. Do not claim completion if validation fails.
          Respect C1 Code Integrity, C2 Integration, C3 Business Integrity, C4 Experience and C5 Production.
          Preserve tenant isolation, RLS, authentication, billing, checkout and deterministic finance/legal logic.
          Never expose secrets, weaken security, mutate production data directly, or bypass CI.
          Do not add Nüva Studio, WhatsApp or n8n, and do not duplicate Nüva Intelligence.
          Do not push directly to main. If a code change is needed, create a branch named
          agent/agency-${{ steps.claim.outputs.active_role }}-${{ github.run_id }}, commit only validated changes,
          and open a pull request. If no code change is needed, record the evidence and remaining risk.
          Use these exact headings, one per line: TASK:, WHY:, FILES:, VALIDATION:, RESULT:, REMAINING_RISK:.
          PROMPT

          export OPENCODE_PERMISSION='{"*":"allow"}'
          opencode run --model "nuva-groq-proxy/gpt-oss-20b" --agent build --title "Nüva Agency ${ACTIVE_AGENT} fallback" "$(cat .agency/groq-fallback-prompt.md)" 2>&1 | tee .agency/groq-fallback-output.log

          test -s .agency/groq-fallback-output.log
          for marker in TASK WHY FILES VALIDATION RESULT REMAINING_RISK; do
            if ! grep -Eiq "^${marker}([[:space:]]*:|[[:space:]]+)" .agency/groq-fallback-output.log; then
              echo "::error::Groq fallback report is missing required evidence section: ${marker}"
              exit 1
            fi
          done
          git diff --check
          npm run build --if-present
          echo "Groq fallback completed; final task status depends on this step's exit code and persisted evidence."

      - name: Finish persisted task
        if: ${{ always() && steps.claim.outputs.has_lease == 'true' }}
        env:
          AGENCY_URL: https://vnzyecnbdqbfuxawzrda.supabase.co/functions/v1/nuva-agency-worker-control
          ACTIVE_AGENT: ${{ steps.claim.outputs.active_role }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
          CONTINUE_1_OUTCOME: ${{ steps.continue_1.outcome }}
          CONTINUE_2_OUTCOME: ${{ steps.continue_2.outcome }}
          CONTINUE_3_OUTCOME: ${{ steps.continue_3.outcome }}
          CONTINUE_4_OUTCOME: ${{ steps.continue_4.outcome }}
          FALLBACK_OUTCOME: ${{ steps.groq_fallback.outcome }}
          WORKER_RESPONSE: ${{ steps.worker.outputs.gemini_response }}
          CONTINUE_1_RESPONSE: ${{ steps.continue_1.outputs.gemini_response }}
          CONTINUE_2_RESPONSE: ${{ steps.continue_2.outputs.gemini_response }}
          CONTINUE_3_RESPONSE: ${{ steps.continue_3.outputs.gemini_response }}
          CONTINUE_4_RESPONSE: ${{ steps.continue_4.outputs.gemini_response }}
        shell: bash
        run: |
          set -euo pipefail

          status="completed"
          gemini_ok=true
          outcomes=("$WORKER_OUTCOME" "$CONTINUE_1_OUTCOME" "$CONTINUE_2_OUTCOME" "$CONTINUE_3_OUTCOME" "$CONTINUE_4_OUTCOME")
          for outcome in "${outcomes[@]}"; do
            if [ "$outcome" != "success" ]; then gemini_ok=false; break; fi
          done
          if [ "$gemini_ok" != true ] && [ "$FALLBACK_OUTCOME" != "success" ]; then status="failed"; fi

          fallback_response=""
          if [ -s .agency/groq-fallback-output.log ]; then fallback_response="$(tail -c 1200 .agency/groq-fallback-output.log)"; fi
          summary="$(jq -n \
            --arg run "$GITHUB_RUN_ID" --arg agent "$ACTIVE_AGENT" --arg status "$status" \
            --arg worker_outcome "$WORKER_OUTCOME" --arg worker_response "${WORKER_RESPONSE:0:800}" \
            --arg pass1_outcome "$CONTINUE_1_OUTCOME" --arg pass1_response "${CONTINUE_1_RESPONSE:0:800}" \
            --arg pass2_outcome "$CONTINUE_2_OUTCOME" --arg pass2_response "${CONTINUE_2_RESPONSE:0:800}" \
            --arg pass3_outcome "$CONTINUE_3_OUTCOME" --arg pass3_response "${CONTINUE_3_RESPONSE:0:800}" \
            --arg pass4_outcome "$CONTINUE_4_OUTCOME" --arg pass4_response "${CONTINUE_4_RESPONSE:0:800}" \
            --arg fallback_outcome "$FALLBACK_OUTCOME" --arg fallback_response "$fallback_response" \
            '{run_id:$run,agent_id:$agent,status:$status,passes:{
              initial:{outcome:$worker_outcome,response_excerpt:$worker_response},
              continuation_1:{outcome:$pass1_outcome,response_excerpt:$pass1_response},
              continuation_2:{outcome:$pass2_outcome,response_excerpt:$pass2_response},
              continuation_3:{outcome:$pass3_outcome,response_excerpt:$pass3_response},
              continuation_4:{outcome:$pass4_outcome,response_excerpt:$pass4_response},
              groq_fallback:{outcome:$fallback_outcome,response_excerpt:$fallback_response}
            }}')"

          payload="$(jq -n --arg token "$AGENCY_LEASE_TOKEN" --arg status "$status" --arg summary "$summary" --arg run "$GITHUB_RUN_ID" --arg agent "$ACTIVE_AGENT" --arg worker "$WORKER_OUTCOME" --arg p1 "$CONTINUE_1_OUTCOME" --arg p2 "$CONTINUE_2_OUTCOME" --arg p3 "$CONTINUE_3_OUTCOME" --arg p4 "$CONTINUE_4_OUTCOME" --arg fallback "$FALLBACK_OUTCOME" \
            '{action:"finish_task",leaseToken:$token,status:$status,summary:$summary,result:{run_id:$run,agent_id:$agent,status:$status,pass_outcomes:{initial:$worker,continuation_1:$p1,continuation_2:$p2,continuation_3:$p3,continuation_4:$p4,groq_fallback:$fallback}}}')"

          curl -fsS -X POST "$AGENCY_URL" \
            -H "X-Agency-OIDC-Token: $AGENCY_OIDC_TOKEN" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -H "X-Agency-Run-Id: $GITHUB_RUN_ID" \
            -H "X-Agency-Agent-Id: $ACTIVE_AGENT" \
            --data "$payload" | jq .
