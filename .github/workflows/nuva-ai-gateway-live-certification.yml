name: Nüva Agency — AI Gateway Live Certification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Fast"]
    types: [completed]
  push:
    paths:
      - "scripts/nuva-ai-gateway.mjs"
      - ".github/workflows/nuva-ai-gateway-live-certification.yml"

permissions:
  contents: read
  id-token: write
  statuses: write


jobs:
  live-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live provider certification through Supabase OIDC broker
        id: broker
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fvnzyecnbdqbfuxawzrda.supabase.co"
          oidc_token="$(curl --fail-with-body -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$oidc_url" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          account_id="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$account_id" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            if discovery_code="$(curl -sS -o /tmp/cloudflare-accounts.json -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts?page=1&per_page=50" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"; then
              if [ "$discovery_code" = "200" ]; then
                account_id="$(jq -r '.result[]?.id | select(test("^[a-fA-F0-9]{32}$"))' /tmp/cloudflare-accounts.json | head -n 1)"
              fi
            else
              discovery_code="network_error"
            fi
          fi
          if [ -n "$account_id" ]; then echo "cloudflare_account_id_available=true"; else echo "cloudflare_account_id_available=false"; fi
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "cloudflare_api_token_configured=true"; else echo "cloudflare_api_token_configured=false"; fi
          payload="$(CLOUDFLARE_ACCOUNT_ID="$account_id" node -e 'console.log(JSON.stringify({action:"health",providers:["gemini","groq","cloudflare"],cloudflareAccountId:process.env.CLOUDFLARE_ACCOUNT_ID || ""}))')"
          response="$(curl --fail-with-body -sS -X POST "https://vnzyecnbdqbfuxawzrda.supabase.co/functions/v1/nuva-agency-ai-broker" -H "Authorization: Bearer $oidc_token" -H "content-type: application/json" -d "$payload")"
          echo "$response" > /tmp/nuva-broker-results.json
          cat /tmp/nuva-broker-results.json
          node -e 'const x=require("/tmp/nuva-broker-results.json"); const required=["gemini","groq"]; if(required.some(p=>!x.results.find(r=>r.provider===p&&r.pass))) process.exit(1); console.log("Gemini + Groq certified; Cloudflare remains optional.")'
          node -e 'const x=require("/tmp/nuva-broker-results.json"); require("fs").writeFileSync("/tmp/nuva-gateway-results.tsv",x.results.map(r=>r.provider+"\t"+(r.pass?"PASS":"FAIL")+"\tOIDC_BROKER").join("\n")+"\n")'

      - name: Publish per-provider certification statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ ! -f /tmp/nuva-gateway-results.tsv ]; then exit 0; fi
          while IFS=$'\t' read -r provider result model; do
            [ -n "$provider" ] || continue
            if [ "$result" = "PASS" ]; then state=success; else state=failure; fi
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/statuses/$SHA" \
              -d "$(PROVIDER="$provider" RESULT="$result" MODEL="$model" python -c 'import json,os; print(json.dumps({"state":"success" if os.environ["RESULT"]=="PASS" else "failure","context":"nuva-agency/ai-gateway/"+os.environ["PROVIDER"],"description":os.environ["RESULT"]+" ["+os.environ["MODEL"]+"]"}))')"
          done < /tmp/nuva-gateway-results.tsv

      - name: Publish certification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          state="${{ job.status }}"
          if [ -f /tmp/nuva-gateway-results.tsv ]; then
            evidence="$(tr '\t' '=' < /tmp/nuva-gateway-results.tsv | paste -sd ' ' -)"
          else
            evidence="provider_evidence_unavailable"
          fi
          desc="Gateway $state; $evidence"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha || github.sha }}" \
            -d "$(STATE="$state" DESC="$desc" REPO="${{ github.repository }}" RUN="${{ github.run_id }}" node -e 'console.log(JSON.stringify({state:process.env.STATE,context:"nuva-agency/ai-gateway-live",description:process.env.DESC,target_url:"https://github.com/"+process.env.REPO+"/actions/runs/"+process.env.RUN}))' )"
