name: Nüva Agency — AI Gateway Live Certification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Fast"]
    types: [completed]
  push:
    paths:
      - "scripts/nuva-ai-gateway.mjs"
      - ".github/workflows/nuva-ai-gateway-live-certification.yml"

permissions:
  contents: read
  statuses: write


jobs:
  live-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify provider configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo "Gemini: NOT_CONFIGURED"; exit 1; }
          test -n "$GROQ_API_KEY" || { echo "Groq: NOT_CONFIGURED"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare token: NOT_CONFIGURED"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account: NOT_CONFIGURED"; exit 1; }
          echo "All three providers configured."
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Live provider probes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { providerStatus, generate } from "./scripts/nuva-ai-gateway.mjs";
          const expected = "NÜVA_HEALTH_OK";
          const failures = [];
          for (const item of providerStatus()) {
            if (!item.configured) {
              console.log(item.provider + ": FAIL (not configured)");
              failures.push(item.provider + ":not_configured");
              continue;
            }
            try {
              const result = await generate(expected, { providers: [item.provider], timeoutMs: 30000 });
              const ok = result.content.trim() === expected;
              console.log(item.provider + ": " + (ok ? "PASS" : "FAIL") + " [" + result.model + "]");
              if (!ok) failures.push(item.provider + ":unexpected_response");
            } catch (error) {
              const details = error?.failures?.find((x) => x.provider === item.provider);
              console.log(item.provider + ": FAIL" + (details?.status ? " HTTP " + details.status : ""));
              failures.push(item.provider + ":request_failed");
            }
          }
          if (failures.length) {
            console.error("LIVE_CERTIFICATION_FAILED");
            process.exit(1);
          }
          console.log("LIVE_CERTIFICATION_PASS");
          NODE
      - name: Publish certification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status }}
          DESC: ${{ job.status == 'success' && 'All configured AI providers passed the live exact-response probe.' || 'One or more AI providers failed the live exact-response probe.' }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          state="${{ job.status }}"
          if [ "$state" = "success" ]; then desc="All configured AI providers passed the live exact-response probe."; else desc="One or more AI providers failed the live exact-response probe."; fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha || github.sha }}" \
            -d "$(node -e 'console.log(JSON.stringify({state:process.env.STATE,context:"nuva-agency/ai-gateway-live",description:process.env.DESC,target_url:"https://github.com/"+process.env.REPO+"/actions"}))' )"
