name: Repair npm lockfile

on:
  push:
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git add package-lock.json
          git commit -m "chore(ci): synchronize npm lockfile"
          git push
      - name: Remove repair workflow
        run: |
          git rm .github/workflows/repair-lockfile.yml
          git commit -m "chore(ci): remove temporary lockfile repair workflow"
          git push
