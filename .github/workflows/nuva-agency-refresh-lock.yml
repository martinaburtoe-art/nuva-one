name: Nüva Agency — Refresh dependency lock

on:
  push:
    branches:
      - feat/telegram-agency-control-plane-20261006
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/telegram-agency-control-plane-20261006
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile from registry
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "nuva-agency[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): regenerate dependency lockfile"
          git push origin HEAD:feat/telegram-agency-control-plane-20261006
