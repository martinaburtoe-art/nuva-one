name: Industry Profile Catalog

on:
  push:
    branches:
      - "feat/industry-intelligence-**"
  pull_request:
    branches:
      - "fix/resumen-mobile-release-20261112"
      - "feat/industry-intelligence-**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: industry-profile-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-industry-catalog:
    name: Validate sector registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify migration filenames and ordering
        run: npm run verify:migrations
      - name: Test Chilean industry profiles
        run: npx vitest run src/lib/industry-profiles.test.ts
      - name: Test capability release gates
        run: npx vitest run src/lib/industry-capability-readiness.test.ts
      - name: Test adaptive onboarding plans
        run: npx vitest run src/lib/industry-onboarding.test.ts
      - name: Test tenant industry configuration contract
        run: |
          if [ -f src/lib/industry-configuration.test.ts ]; then
            npx vitest run src/lib/industry-configuration.test.ts
          else
            echo "P0 configuration contract is not present on this base ref yet"
          fi
      - name: Test evidence-gated sector dashboard metrics
        run: npx vitest run src/lib/industry-dashboard.test.ts
      - name: Typecheck application
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build
