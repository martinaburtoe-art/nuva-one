name: Nüva Agency — Deploy Telegram Edge Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/nuva-telegram-agency/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Deploy when scoped Supabase credentials are configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Supabase Management credentials are not configured; live function already remains available until a new deploy is required."
            exit 0
          fi
          project_ref="${SUPABASE_PROJECT_REF:-vnzyecnbdqbfuxawzrda}"
          npx --yes supabase@latest functions deploy nuva-telegram-agency --project-ref "$project_ref" --no-verify-jwt
