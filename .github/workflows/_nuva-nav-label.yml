name: Temporary Nüva nav label update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-nav:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update landing navigation label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routes/index.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''              <Sparkles className="mr-1.5 h-3.5 w-3.5" />\n              Demo'''
          new = '''              <Sparkles className="mr-1.5 h-3.5 w-3.5" />\n              Visualizar Nüva'''
          if old not in text:
              raise SystemExit("Expected landing nav Demo label was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_nuva-nav-label.yml
          git add src/routes/index.tsx
          git commit -m "feat: label landing demo as Visualizar Nüva"
          git push origin main
