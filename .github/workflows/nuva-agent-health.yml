name: Nüva One — Autonomous Health Auditor

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: nuva-agent-health-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Run Gemini health audit
        id: gemini
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          prompt: |
            Perform a read-only daily health audit of Nüva One.

            Read GEMINI.md and docs/AGENT_BACKLOG.md. Inspect recent commits, open PRs/issues, workflow status, package scripts, and the relevant repository documentation. Do not edit code.

            Identify only evidence-backed blockers, regressions, security risks, broken user flows, or high-value unfinished work. Do not repeat historical audits that already have current passing evidence.

            Produce a concise report with: HEALTH, verified findings, evidence, priority, and the single most useful next autonomous task.

            If there are no actionable findings, explicitly say NO_ACTIONABLE_FINDINGS.
          settings: |
            {
              "general": {
                "defaultApprovalMode": "plan"
              },
              "model": {
                "maxSessionTurns": 20
              },
              "telemetry": {
                "enabled": false
              }
            }

      - name: Report provider failure without losing the scheduled audit
        if: steps.gemini.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "⚠️ Health auditor unavailable — $(date -u +%Y-%m-%d)" \
            --body "## Daily health audit not completed\n\nGemini CLI failed during the scheduled audit. The workflow preserves an explicit incident instead of silently skipping the health check. Inspect the failed Gemini step logs for authentication, quota, or provider availability details. No product health PASS is inferred from this failure.\n\nRun: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Create daily health issue when actionable
        if: steps.gemini.outcome == 'success' && contains(steps.gemini.outputs.summary, 'NO_ACTIONABLE_FINDINGS') == false
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.gemini.outputs.summary }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🤖 Autonomous health report — $(date -u +%Y-%m-%d)" \
            --body "## Nüva One daily autonomous health report\n\n${REPORT}"
