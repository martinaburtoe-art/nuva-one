name: Nüva Agency — Independent Safety Verification

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  statuses: write
  checks: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Find one Agency PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName --jq '[.[] | select(.headRefName | startswith("agent/agency-"))][0].number // empty')
          if [ -z "$number" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Checkout Agency PR
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="${{ steps.pr.outputs.number }}"
          sha=$(gh pr view "$number" --json headRefOid --jq '.headRefOid')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git fetch origin "$sha"
          git checkout --detach "$sha"

      - name: Inspect autonomous diff policy
        if: steps.pr.outputs.eligible == 'true'
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="${{ steps.pr.outputs.number }}"
          files="$(gh pr diff "$number" --name-only)"
          echo "$files"
          blocked='^(\.github/workflows/|supabase/migrations/|supabase/functions/|src/routes/auth|src/routes/api/(billing|checkout)|src/lib/(auth|security)|src/integrations/supabase/types\.ts$)'
          if echo "$files" | grep -Eq "$blocked"; then
            echo "Blocked sensitive path detected."
            exit 1
          fi
          additions=$(gh pr view "$number" --json additions --jq '.additions')
          deletions=$(gh pr view "$number" --json deletions --jq '.deletions')
          total=$((additions + deletions))
          if [ "$total" -gt 220 ]; then
            echo "Autonomous diff exceeds 220 changed lines."
            exit 1
          fi

      - name: Install dependencies
        if: steps.pr.outputs.eligible == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Independent lint
        if: steps.pr.outputs.eligible == 'true'
        run: npm run lint

      - name: Independent typecheck
        if: steps.pr.outputs.eligible == 'true'
        run: npm run typecheck

      - name: Independent unit tests
        if: steps.pr.outputs.eligible == 'true'
        run: npm run test

      - name: Independent production build
        if: steps.pr.outputs.eligible == 'true'
        run: npm run build

      - name: Publish verified commit status
        if: steps.pr.outputs.eligible == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ steps.pr.outputs.sha }}"             -f state=success             -f context='nuva-agency/safety'             -f description='Independent Agency lint, typecheck, tests and build passed.'

      - name: Publish failed commit status
        if: steps.pr.outputs.eligible == 'true' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ steps.pr.outputs.sha }}"             -f state=failure             -f context='nuva-agency/safety'             -f description='Independent Agency safety verification failed.'
