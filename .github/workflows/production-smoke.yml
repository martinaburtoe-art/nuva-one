name: Production Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production document and every referenced frontend asset
        run: |
          node <<'NODE'
          const htmlUrl = 'https://nuva-one.vercel.app/?_nuva_smoke=' + Date.now();
          const htmlResponse = await fetch(htmlUrl, {redirect: 'follow'});
          if (!htmlResponse.ok) throw new Error(`Production returned ${htmlResponse.status}`);
          const html = await htmlResponse.text();
          if (!/<html/i.test(html) || !/<script/i.test(html)) throw new Error('Production document is incomplete');
          const title = html.match(/<title[^>]*>(.*?)<\/title>/is)?.[1]?.trim() ?? '';
          if (!/Nüva|Nuva/i.test(title)) throw new Error(`Unexpected title: ${title}`);

          const refs = new Set();
          const patterns = [
            /<script[^>]+src=["']([^"']+)["']/gi,
            /<link[^>]+href=["']([^"']+)["']/gi,
            /(?:import|from)[\s\(]+["']([^"']+\.js(?:\?[^"']*)?)["']/gi
          ];
          for (const re of patterns) {
            for (const match of html.matchAll(re)) {
              const ref = match[1];
              if (ref.startsWith('/assets/')) refs.add(new URL(ref, htmlResponse.url).href);
            }
          }
          if (!refs.size) throw new Error('No frontend assets were referenced by production HTML');

          const failures = [];
          for (const url of refs) {
            const response = await fetch(url, {redirect: 'follow'});
            if (!response.ok) failures.push(`${response.status} ${url}`);
          }
          if (failures.length) {
            console.error(failures.join('\n'));
            throw new Error(`${failures.length} referenced frontend assets failed`);
          }

          console.log(JSON.stringify({status:'ok', title, referencedAssets:refs.size, checkedAssets:refs.size}, null, 2));
          NODE

      - name: Verify stale-chunk recovery code is present
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/martinaburtoe-art/nuva-one/main/src/routes/__root.tsx \
            -o /tmp/root.tsx
          grep -q 'recoverFromStaleChunk' /tmp/root.tsx
          grep -q '_nuva_refresh' /tmp/root.tsx
