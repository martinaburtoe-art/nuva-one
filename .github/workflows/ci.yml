name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, typecheck, test, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: "2.115.0"

      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Supabase migration integrity
        run: npm run verify:migrations

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Start local Supabase stack
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Starting Supabase local stack (attempt ${attempt}/3)"
            if supabase start; then
              echo "Supabase local stack started"
              exit 0
            fi
            supabase status || true
            docker ps -a || true
            if [ "$attempt" -lt 3 ]; then
              supabase stop --no-backup || true
              sleep 10
            fi
          done
          echo "Supabase failed to start after 3 attempts"
          exit 1

      - name: Regenerate database types from local schema
        run: |
          supabase gen types typescript --local > src/integrations/supabase/types.ts
          test -s src/integrations/supabase/types.ts

      - name: Verify lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup || true

  database-tests:
    name: pgTAP database tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: "2.115.0"

      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Verify Supabase migration integrity
        run: |
          node scripts/verify-migrations.mjs

      - name: Start Supabase local stack
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Starting Supabase local stack (attempt ${attempt}/3)"
            if supabase start; then
              echo "Supabase local stack started"
              exit 0
            fi
            echo "Supabase start failed; collecting diagnostics before retry"
            supabase status || true
            docker ps -a || true
            if [ "$attempt" -lt 3 ]; then
              supabase stop --no-backup || true
              sleep 10
            fi
          done
          echo "Supabase failed to start after 3 attempts"
          exit 1

      - name: Run pgTAP tests
        run: |
          set -o pipefail
          for attempt in 1 2; do
            echo "Running pgTAP database tests (attempt ${attempt}/2)"
            if supabase test db; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "pgTAP failed; retrying after a clean local stack restart"
              supabase stop --no-backup || true
              supabase start
            fi
          done
          exit 1

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup || true
