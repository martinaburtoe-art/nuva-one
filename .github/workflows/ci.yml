name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: pgTAP database tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: "2.115.0"
      - name: Verify Docker
        run: |
          docker version
          docker info
      - name: Verify Supabase migration integrity
        run: node scripts/verify-migrations.mjs
      - name: Start lean Supabase database test stack
        run: |
          set -euo pipefail
          start_log=/tmp/supabase-start.log
          rm -f "$start_log"
          timeout --signal=TERM --kill-after=30s 12m \
            supabase start --ignore-health-check \
            -x studio,realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta \
            2>&1 | tee "$start_log"
          supabase status
      - name: Generate database types from clean schema
        run: |
          supabase gen types typescript --local > /tmp/generated-supabase-types.ts
          cp /tmp/generated-supabase-types.ts src/integrations/supabase/types.ts
      - name: Run pgTAP tests
        run: |
          set -o pipefail
          for attempt in 1 2; do
            if supabase test db; then exit 0; fi
            if [ "$attempt" -lt 2 ]; then
              supabase stop --no-backup || true
              timeout --signal=TERM --kill-after=30s 12m \
                supabase start --ignore-health-check \
                -x studio,realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
            fi
          done
          exit 1
      - name: Recovery drill — rebuild schema from migrations
        run: |
          set -o pipefail
          supabase db reset --local
          supabase gen types typescript --local > /tmp/recovery-supabase-types.ts
          cp /tmp/recovery-supabase-types.ts src/integrations/supabase/types.ts
          supabase test db
      - name: Upload generated database types
        uses: actions/upload-artifact@v4
        with:
          name: generated-supabase-types
          path: src/integrations/supabase/types.ts
          if-no-files-found: error
          retention-days: 7
      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup || true

  build-and-test:
    name: Lint, typecheck, test, audit, build
    needs: database-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify Supabase migration integrity
        run: npm run verify:migrations
      - name: Commit refreshed npm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          npm install --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git add package-lock.json
          git commit -m "security: refresh npm lockfile for patched browserslist"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Upload refreshed npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Download generated database types
        uses: actions/download-artifact@v4
        with:
          name: generated-supabase-types
          path: src/integrations/supabase
      - name: Verify lint
        id: lint
        run: npm run lint
      - name: Generate ESLint warning inventory
        run: npm run lint:report
      - name: Upload ESLint warning inventory
        uses: actions/upload-artifact@v4
        with:
          name: eslint-warning-inventory
          path: eslint-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  browser-quality:
    name: Browser quality gate
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://vnzyecnbdqbfuxawzrda.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_HrwPy_KEw7KzxjCf9wphQQ_64VyMrCj
      VITE_SUPABASE_PROJECT_ID: vnzyecnbdqbfuxawzrda
      VITE_SUPABASE_URL: https://vnzyecnbdqbfuxawzrda.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_HrwPy_KEw7KzxjCf9wphQQ_64VyMrCj
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser test dependencies
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0 @axe-core/playwright@4.11.0
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start production bundle server for browser gate
        run: |
          set -euo pipefail
          if [ -f .vercel/output/config.json ] && [ -f .vercel/output/nitro.json ]; then
            npx nitro preview --port 3000 --host 127.0.0.1 > /tmp/nuva-browser.log 2>&1 &
          else
            npm run preview -- --host 127.0.0.1 --port 3000 > /tmp/nuva-browser.log 2>&1 &
          fi
          server_pid=$!
          echo "$server_pid" > /tmp/nuva-browser.pid
          for attempt in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/nuva-browser.log; exit 1; fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nuva-browser.log
          exit 1
      - name: Run landing smoke, accessibility and performance gate
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test quality/landing.spec.mjs --reporter=line
      - name: Upload browser quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuva-browser-quality-evidence
          path: |
            artifacts/
            test-results/
            /tmp/nuva-browser.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop application server
        if: always()
        run: |
          if [ -f /tmp/nuva-browser.pid ]; then kill "$(cat /tmp/nuva-browser.pid)" || true; fi
