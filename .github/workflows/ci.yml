name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quality Gate: database -> application -> browser. Keep the pipeline deterministic.
jobs:
  database-tests:
    name: pgTAP database tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: "2.115.0"
      - name: Verify Docker
        run: |
          docker version
          docker info
      - name: Verify Supabase migration integrity
        run: node scripts/verify-migrations.mjs
      - name: Start lean Supabase database test stack
        run: |
          set -euo pipefail
          echo "Starting lean Supabase database stack with health checks bypassed"
          timeout --signal=TERM --kill-after=30s 6m supabase start --ignore-health-check -x studio,realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
          echo "Supabase containers started"
          supabase status
          echo "Waiting for local Postgres readiness"
          for attempt in $(seq 1 60); do
            if supabase db ping --local >/dev/null 2>&1; then
              echo "Local Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Local Postgres did not become ready"
          supabase status || true
          docker ps -a || true
          exit 1
      - name: Generate database types from clean schema
        run: |
          supabase gen types typescript --local > /tmp/generated-supabase-types.ts
          cp /tmp/generated-supabase-types.ts src/integrations/supabase/types.ts
      - name: Run pgTAP tests
        run: |
          set -o pipefail
          for attempt in 1 2; do
            echo "Running pgTAP database tests (attempt ${attempt}/2)"
            if supabase test db; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "pgTAP failed; retrying after a clean local stack restart"
              supabase stop --no-backup || true
              timeout --signal=TERM --kill-after=30s 6m supabase start --ignore-health-check -x studio,realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
            fi
          done
          exit 1
      - name: Recovery drill — rebuild schema from migrations
        run: |
          set -o pipefail
          echo "Running destructive recovery drill against the ephemeral local database only"
          supabase db reset --local
          supabase gen types typescript --local > /tmp/recovery-supabase-types.ts
          cp /tmp/recovery-supabase-types.ts src/integrations/supabase/types.ts
          supabase test db
      - name: Upload generated database types
        uses: actions/upload-artifact@v4
        with:
          name: generated-supabase-types
          path: src/integrations/supabase/types.ts
          if-no-files-found: error
          retention-days: 7
      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup || true

  build-and-test:
    name: Lint, typecheck, test, audit, build
    needs: database-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Supabase migration integrity
        run: npm run verify:migrations
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Download generated database types
        uses: actions/download-artifact@v4
        with:
          name: generated-supabase-types
          path: src/integrations/supabase
      - name: Verify lint
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.log
      - name: Generate ESLint warning inventory
        run: npm run lint:report
      - name: Upload ESLint warning inventory
        uses: actions/upload-artifact@v4
        with:
          name: eslint-warning-inventory
          path: eslint-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish lint diagnostic status
        if: failure() && steps.lint.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msg="$(awk '/error|Error|✖/ {print p2; print p1; print; exit} {p2=p1; p1=$0}' /tmp/lint.log | tr '\n' ' ' | cut -c1-140)"
          if [ -z "$msg" ]; then msg="eslint failed; inspect the CI run log"; fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='ci/lint-diagnostic' \
            -f description="$msg" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  browser-quality:
    name: Browser quality gate
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Test runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start production bundle server for browser gate
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 3000 > /tmp/nuva-browser.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > /tmp/nuva-browser.pid
          for attempt in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Application server exited unexpectedly"
              cat /tmp/nuva-browser.log
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/ > /dev/null; then
              echo "Production preview server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Production preview server did not become ready"
          cat /tmp/nuva-browser.log
          exit 1
      - name: Run landing smoke, accessibility and performance gate
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test quality/landing.spec.mjs --reporter=line
      - name: Upload browser quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuva-browser-quality-evidence
          path: |
            artifacts/landing.png
            artifacts/demo.png
            artifacts/experience.png
            test-results/
            /tmp/nuva-browser.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop application server
        if: always()
        run: |
          if [ -f /tmp/nuva-browser.pid ]; then kill "$(cat /tmp/nuva-browser.pid)" || true; fi
