name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, typecheck, test, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The repository lockfile is currently behind package.json. npm install
      # resolves the declared dependency graph in CI so validation is not blocked
      # by stale lock metadata. A synchronized lockfile should be committed once
      # generated from a network-enabled development environment.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  database-tests:
    name: pgTAP database tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db || (echo "First attempt failed, retrying once..." && supabase test db)

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup
