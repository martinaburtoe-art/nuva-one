name: CI

on:
  push:
    branches:
      - main
      - final-100-client-certification
      - feature/platform-command-center
  pull_request:
    branches:
      - main
      - final-100-client-certification

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  database-tests:
    name: pgTAP database tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Inspect Docker runtime
        run: |
          docker version
          docker info
          docker system df

      - name: Start Supabase local database
        run: supabase start -x studio,imgproxy --ignore-health-check
        timeout-minutes: 10

      - name: Verify local database is reachable
        run: |
          supabase status
          supabase db reset --debug
        timeout-minutes: 10

      - name: Run pgTAP tests
        run: supabase test db --local
        timeout-minutes: 10

      - name: Show Supabase status on failure
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true
