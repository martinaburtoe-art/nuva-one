name: CI

# Runs on every push and PR to main. This is the minimum safety net Nüva One
# had zero of before: if this goes red, something is actually broken --
# investigate before merging/deploying, don't just re-run it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format repository
        run: npx prettier --write .

      - name: Persist formatting fixes
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format repository"
          git push origin HEAD:main

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # NOTE: this is a *static* build check (does the app compile/bundle),
      # not a runtime check. Vite happily builds even with the VITE_SUPABASE_*
      # vars unset -- it just inlines `undefined`, which would break at
      # runtime, not at build time. Catching that class of bug needs a real
      # E2E test hitting a live/staging Supabase project, which is the next
      # step up from this baseline (see FASE 5 del roadmap), not something to
      # fake here with placeholder values that would hide real misconfiguration.
      - name: Build
        run: npm run build

  database-tests:
    name: pgTAP database tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Run pgTAP tests (with one retry for CI-only Docker flakiness)
        run: supabase test db || (echo "First attempt failed, retrying once..." && supabase test db)
