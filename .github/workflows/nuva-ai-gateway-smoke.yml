name: Nüva One — AI Gateway Live Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nuva-ai-gateway.mjs'
      - 'scripts/nuva-agency-gateway-check.mjs'
      - '.github/workflows/nuva-ai-gateway-smoke.yml'

permissions:
  contents: read

jobs:
  gateway:
    name: Live provider and failover certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify gateway with live providers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL }}
          NUVA_GATEWAY_LIVE_TEST: "true"
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run agency:gateway

      - name: Publish certification
        if: always()
        run: |
          {
            echo "## Nüva AI Gateway live certification"
            echo "Each configured provider was tested independently and the normal routing path was tested."
            echo "Credentials are never printed."
          } >> "$GITHUB_STEP_SUMMARY"
