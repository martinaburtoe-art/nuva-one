name: One-time lockfile repair

on:
  push:
    paths:
      - package.json
      - .github/workflows/one-time-lockfile-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'restore excel export dependency') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-lockfile-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/one-time-lockfile-repair.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "chore(ci): synchronize npm lockfile"
          git push
